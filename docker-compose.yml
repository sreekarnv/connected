name: connected

services:
  content:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - |
        uv run --locked alembic upgrade head &&
        exec uv run --locked fastapi dev --host 0.0.0.0 --port 4004
    environment:
      DATABASE_URL: ${CONTENT_DATABASE_URL:-postgresql+asyncpg://content:${CONTENT_DATABASE_PASSWORD:-content}@content-postgres:5432/content}
      IDENTITY_URL: http://identity:4001
      SOCIAL_URL: http://social:4003
    ports:
      - "127.0.0.1:4004:4004"
    volumes:
      - ./services/content:/app
      - /app/.venv
    depends_on:
      content-postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      social:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4004/healthz/', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  content-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_DATABASE_PASSWORD:-content}
    ports:
      - "127.0.0.1:${CONTENT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - content_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  social:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - |
        uv run --locked alembic upgrade head &&
        exec uv run --locked fastapi dev --host 0.0.0.0 --port 4003
    environment:
      DATABASE_URL: ${SOCIAL_DATABASE_URL:-postgresql+asyncpg://social:${SOCIAL_DATABASE_PASSWORD:-social}@social-postgres:5432/social}
      IDENTITY_URL: http://identity:4001
    ports:
      - "127.0.0.1:4003:4003"
    volumes:
      - ./services/social:/app
      - /app/.venv
    depends_on:
      social-postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4003/healthz/', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  social-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${SOCIAL_DATABASE_PASSWORD:-social}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - |
        uv run --locked alembic upgrade head &&
        exec uv run --locked fastapi dev --host 0.0.0.0 --port 4001
    env_file:
      - ./services/identity/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-identity}:${POSTGRES_PASSWORD:-identity}@identity-postgres:5432/${POSTGRES_DB:-identity}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-connected}:${RABBITMQ_PASSWORD:-connected}@rabbitmq:5672/
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./services/identity:/app
      - /app/.venv
    depends_on:
      identity-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/healthz/', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifications:
    image: node:24-bookworm-slim
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - |
        corepack enable &&
        pnpm install --frozen-lockfile &&
        exec pnpm dev
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-connected}:${RABBITMQ_PASSWORD:-connected}@rabbitmq:5672/
      SMTP_URL: smtp://mailhog:1025
      MAIL_FROM: ${MAIL_FROM:-Connected <notifications@connected.test>}
    ports:
      - "127.0.0.1:4002:4002"
    volumes:
      - ./services/notifications:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-connected}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-connected}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8025/api/v2/messages",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  content_postgres_data:
    name: connected_content_postgres_data
  social_postgres_data:
    name: connected_social_postgres_data
  # Keep using the data volumes from the original Compose projects.
  postgres_data:
    name: identity_postgres_data
  rabbitmq_data:
    name: connected-infra_rabbitmq_data
