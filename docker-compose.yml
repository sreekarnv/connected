name: connected

services:
  identity:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    working_dir: /app
    command: ["uv", "run", "--locked", "fastapi", "dev", "--host", "0.0.0.0", "--port", "4001"]
    env_file:
      - ./services/identity/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-identity}:${POSTGRES_PASSWORD:-identity}@postgres:5432/${POSTGRES_DB:-identity}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-connected}:${RABBITMQ_PASSWORD:-connected}@rabbitmq:5672/
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./services/identity:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-connected}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-connected}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8025/api/v2/messages",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Keep using the data volumes from the original Compose projects.
  postgres_data:
    name: identity_postgres_data
  rabbitmq_data:
    name: connected-infra_rabbitmq_data
