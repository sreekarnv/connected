[project]
name = "connected-social"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "connected_social.main:app"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
