services:
  identity:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    working_dir: /app
    command: ["uv", "run", "--locked", "fastapi", "dev", "--host", "0.0.0.0", "--port", "4001"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-identity}:${POSTGRES_PASSWORD:-identity}@postgres:5432/${POSTGRES_DB:-identity}
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
