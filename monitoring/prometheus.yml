global:
  scrape_interval: 15s

# Backend targets use Compose DNS; the gateway runs on the host.
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [host.docker.internal:4000]
        labels:
          service: gateway
  - job_name: identity
    static_configs:
      - targets: [identity:4001]
  - job_name: notifications
    static_configs:
      - targets: [notifications:4002]
  - job_name: social
    static_configs:
      - targets: [social:4003]
  - job_name: content
    static_configs:
      - targets: [content:4004]
